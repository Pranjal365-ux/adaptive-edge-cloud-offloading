name: Build and publish containers

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and quality dependencies
        run: python -m pip install -e ".[dev,live,services]"
      - name: Lint
        run: python -m ruff check .
      - name: Test with coverage
        run: python -m pytest --cov=offloader --cov-report=term-missing
      - name: Smoke the simulator CLI
        run: python offloading.py --tasks 20 --seeds 1 --bootstrap-resamples 100 --output ci-results

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image namespace
        id: image
        shell: bash
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: edge-meta
        with:
          images: ghcr.io/${{ steps.image.outputs.owner }}/offloadops-edge
          tags: |
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.edge-meta.outputs.tags }}
          labels: ${{ steps.edge-meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: docker/metadata-action@v5
        id: cloud-meta
        with:
          images: ghcr.io/${{ steps.image.outputs.owner }}/offloadops-cloud
          tags: |
            type=sha,format=long
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud/Dockerfile
          push: true
          tags: ${{ steps.cloud-meta.outputs.tags }}
          labels: ${{ steps.cloud-meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Report immutable image references
        env:
          OWNER: ${{ steps.image.outputs.owner }}
        run: |
          {
            echo "### Published immutable images"
            echo "- Edge: ghcr.io/${OWNER}/offloadops-edge:sha-${GITHUB_SHA}"
            echo "- Cloud: ghcr.io/${OWNER}/offloadops-cloud:sha-${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
