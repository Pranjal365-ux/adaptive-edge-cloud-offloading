name: Build and publish containers

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase image namespace
        id: image
        shell: bash
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: edge-meta
        with:
          images: ghcr.io/${{ steps.image.outputs.owner }}/offloadops-edge
          tags: |
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.edge-meta.outputs.tags }}
          labels: ${{ steps.edge-meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: docker/metadata-action@v5
        id: cloud-meta
        with:
          images: ghcr.io/${{ steps.image.outputs.owner }}/offloadops-cloud
          tags: |
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cloud/Dockerfile
          push: true
          tags: ${{ steps.cloud-meta.outputs.tags }}
          labels: ${{ steps.cloud-meta.outputs.labels }}
          provenance: true
          sbom: true
