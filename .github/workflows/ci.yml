name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev,live,services]"
      - name: Lint
        run: python -m ruff check .
      - name: Test with coverage
        run: python -m pytest --cov=offloader --cov-report=term-missing
      - name: Smoke the simulator CLI
        run: python offloading.py --tasks 20 --seeds 1 --bootstrap-resamples 100 --output ci-results

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local stack images
        run: docker compose build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      - name: Initialize without backend
        run: terraform -chdir=infra/envs/dev init -backend=false -input=false
      - name: Validate without credentials or apply
        run: terraform -chdir=infra/envs/dev validate
