name: offloadops

services:
  edge:
    build:
      context: .
      dockerfile: Dockerfile
    image: offloadops-edge:local
    environment:
      CLOUD_URL: ${CLOUD_URL:-http://toxiproxy:8666}
      CLOUD_API_KEY: ${CLOUD_API_KEY:-local-demo-key}
      EDGE_WORKERS: ${EDGE_WORKERS:-2}
      BUILD_SHA: ${BUILD_SHA:-local}
    ports:
      - "127.0.0.1:8000:8080"
    depends_on:
      toxiproxy:
        condition: service_started
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  cloud:
    build:
      context: .
      dockerfile: cloud/Dockerfile
    image: offloadops-cloud:local
    environment:
      CLOUD_API_KEY: ${CLOUD_API_KEY:-local-demo-key}
      CLOUD_WORKERS: ${CLOUD_WORKERS:-2}
      BUILD_SHA: ${BUILD_SHA:-local}
    expose:
      - "8081"
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/etc/toxiproxy/config.json"]
    volumes:
      - ./toxiproxy/config.json:/etc/toxiproxy/config.json:ro
    expose:
      - "8666"
      - "8474"
    ports:
      - "127.0.0.1:8474:8474"
    mem_limit: 128m
    cpus: 0.25
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=24h"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      edge:
        condition: service_healthy
      cloud:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-demo-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
    mem_limit: 256m
    cpus: 0.5

volumes:
  prometheus-data:
  grafana-data:
